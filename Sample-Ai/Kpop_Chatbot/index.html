<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Group Members : Ambuyoc, Berces, Formento, Ocbian, Tripulca -->
  <meta charset="UTF-8">
  <title>K-Pop Streaming Chatbot</title>
  <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="app">

  
  <aside class="sidebar">
    <h3>📂 Chats</h3>
    <button id="newChat">➕ New Chat</button>
    <div id="chatList"></div>
  </aside>

 
  <main class="main">

    <button id="toggleTheme">🌙 Dark Mode</button>

    <h2 id="title">🎤 K-Pop AI Chatbot (Eunwoo)</h2>

    <div id="chat"></div>

    
    <div id="status" style="font-style: italic; color: gray; display: none;">Eunwoo is typing...</div>

    <textarea
      id="prompt"
      rows="3"
      placeholder="Ask anything about K-Pop..."
    ></textarea>

    <br>

    <button id="send">Send</button>
    <button id="clearChat">Clear Chat</button>

  </main>
</div>

<script src="/static/Kpop_Chatbot.js"></script>
</body>
</html>
